<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0e0d" />
    <title>Базар</title>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <!--
      iOS web push: Apple разрешает пуши ТОЛЬКО для web-приложений,
      добавленных на главный экран (iOS 16.4+). Для этого нужны:
        - manifest с display: standalone (уже есть)
        - apple-mobile-web-app-capable = yes
        - apple-touch-icon ровно 180x180
      Без этих тегов Safari не считает сайт приложением и push не работает.
    -->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Базар" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
    <!--
      OneSignal init вынесен в /onesignal-init.js (внешний файл с 'self').
      Раньше это был инлайновый <script>, и CSP (`script-src 'self' …`) его
      блокировал: «Executing inline script violates …» — ошибка в консоли на
      каждой из 24 страниц. Внешний файл решает это без 'unsafe-inline'.
      defer гарантирует порядок: SDK → init.
    -->
    <script src="/onesignal-init.js" defer></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
